<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Kontrola - RGB</title>
    <!-- Uvozimo Bootstrap 5 preko CDN-a za brutalan izgled bez muke -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-dark text-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                
                <div class="card bg-secondary text-white p-4 shadow-lg">
                    <h2 class="mb-4">Kontrola LED Diode</h2>
                    
                    <!-- Status poruka koja se menja bez refresha -->
                    <div id="status-poruka" class="alert alert-info py-2" role="alert">
                        Sistem spreman.
                    </div>

                    <div class="d-grid gap-3 col-8 mx-auto mt-3">
                        <!-- Dugme za UKLJUČIVANJE -->
                        <button onclick="saljiKomandu('on')" class="btn btn-success btn-lg">
                            UKLJUČI (ON)
                        </button>
                        
                        <!-- Dugme za ISKLJUČIVANJE -->
                        <button onclick="saljiKomandu('off')" class="btn btn-danger btn-lg">
                            ISKLJUČI (OFF)
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript deo sa Fetch API-jem (Nema osvežavanja stranice!) -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
